[package]
name = "relayhub"
version = "0.1.5"
description = "Personal multi-station API monitor"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "api_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
axum = "0.8"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls", "stream"] }
imap = "3.0.0-alpha.15"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = { version = "3", features = ["windows-native"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
chrono = "0.4"
cookie = "0.18"
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
rfd = "0.15"
ssh2 = "0.9"
tempfile = "3"
toml = "0.8"
toml_edit = "0.22"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

[patch.crates-io]
tauri-utils = { git = "https://github.com/tauri-apps/tauri.git", rev = "dd725f4" }
