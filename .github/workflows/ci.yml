name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  supabase-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
      - run: supabase start
      - run: supabase db reset --local
      - run: supabase db lint --local

  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install chromium
      - run: pnpm test:ui
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test --locked
        working-directory: src-tauri

  rust-dependency-audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit the Windows Rust dependency graph
        shell: pwsh
        run: ./scripts/audit-rustsec.ps1 -ManifestPath src-tauri/Cargo.toml -TargetTriple x86_64-pc-windows-msvc

  real-station-e2e:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    environment: production-e2e
    steps:
      - uses: actions/checkout@v4
      - name: Run credential-backed station lifecycle suite
        shell: pwsh
        env:
          RELAYHUB_E2E_SUB2_EMAIL: ${{ secrets.RELAYHUB_E2E_SUB2_EMAIL }}
          RELAYHUB_E2E_SUB2_PASSWORD: ${{ secrets.RELAYHUB_E2E_SUB2_PASSWORD }}
          RELAYHUB_E2E_NEWAPI_USERNAME: ${{ secrets.RELAYHUB_E2E_NEWAPI_USERNAME }}
          RELAYHUB_E2E_NEWAPI_PASSWORD: ${{ secrets.RELAYHUB_E2E_NEWAPI_PASSWORD }}
        run: ./scripts/test-station-lifecycle.ps1
