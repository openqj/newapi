name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install chromium
      - run: pnpm test:ui
      - run: cargo test
        working-directory: src-tauri

  real-station-e2e:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    environment: production-e2e
    steps:
      - uses: actions/checkout@v4
      - name: Run credential-backed station lifecycle suite
        shell: pwsh
        env:
          RELAYHUB_E2E_SUB2_EMAIL: ${{ secrets.RELAYHUB_E2E_SUB2_EMAIL }}
          RELAYHUB_E2E_SUB2_PASSWORD: ${{ secrets.RELAYHUB_E2E_SUB2_PASSWORD }}
          RELAYHUB_E2E_NEWAPI_USERNAME: ${{ secrets.RELAYHUB_E2E_NEWAPI_USERNAME }}
          RELAYHUB_E2E_NEWAPI_PASSWORD: ${{ secrets.RELAYHUB_E2E_NEWAPI_PASSWORD }}
        run: ./scripts/test-station-lifecycle.ps1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: RelayHub ${{ github.ref_name }}
          releaseBody: See the Git commit history for this version.
          releaseDraft: true
          prerelease: false
